group:
  - name: success
    logfile: LogFormat.txt
    logMetaData:
      - name: '@timestamp'
        DataType: DateTime
        ValueType: Current
        Value: datetime_clf
      - name: host,ip
        DataType: String
        ValueType: FromLocalAsList
        Value: UniqueKey
      - name: host,name
        DataType: String
        ValueType: FromLocal
        Value: UniqueKey
      - name: host,hostname
        DataType: String
        ValueType: FromLocal
        Value: UniqueKey
      - name: source_id
        DataType: String
        ValueType: FromLocal
        Value: UniqueKey
      - name: host_ip
        DataType: String
        ValueType: FromLocal
        Value: UniqueKey
      - name: target
        DataType: String
        ValueType: FromLocal
        Value: UniqueKey
      - name: doc_type
        DataType: String
        ValueType: Constant
        Value: access_log
      - name: topic_name
        DataType: String
        ValueType: Constant
        Value: apache-logs-input
      - name: type
        DataType: String
        ValueType: Constant
        Value: apache
      - name: vublock_name
        DataType: String
        ValueType: Constant
        Value: apache
      - name: '@metadata,beat'
        DataType: String
        ValueType: Constant
        Value: filebeat
      - name: '@metadata,type'
        DataType: String
        ValueType: Constant
        Value: _doc
      - name: '@metadata,version'
        DataType: String
        ValueType: Constant
        Value: 8.1.4
      - name: agent,name
        DataType: String
        ValueType: Constant
        Value: e2e-97-241
      - name: agent,type
        DataType: String
        ValueType: Constant
        Value: filebeat
      - name: agent,version
        DataType: String
        ValueType: Constant
        Value: 8.1.4
      - name: agent,ephemeral_id
        DataType: String
        ValueType: Constant
        Value: 0334291c-e80c-4e7c-88cd-f802aa243b56
      - name: agent,id
        DataType: String
        ValueType: Constant
        Value: 131748f7-7c03-4738-b6f8-ab47d892d12e
    fields:
      - name: accessTime
        DataType: DateTime
        ValueType: Current
        Value: datetime_clf
      - name: accessMethod
        DataType: String
        ValueType: "Enumeration"
        Value: "GET:90,POST:8,PUT:1,DELETE:1"
      - name: remoteIP
        DataType: IPv4
        ValueType: RandomRange
        Value: "192.168.10.1-192.168.10.255"
      - name: accessURI
        DataType: String
        ValueType: "RandomRange"
        Value: "/abcd/aa23/xyz_\\d{3}"
      - name: respCode
        DataType: Uint32
        ValueType: "Enumeration"
        Value: "200:90,404:5,403:2,500:3"
      - name: bytes
        DataType: Uint32
        ValueType: "RandomRange"
        Value: "100-3000"
      - name: time
        DataType: Uint32
        ValueType: "RandomRange"
        Value: "200-3000"

output.kafka:
  enabled: true
  topic: "apache-logs-input"

output.file:
  enabled: false
  path: ./tmp/apache/
  filename: access.log
  rotate_every_mb: 1
  max_files: 5 