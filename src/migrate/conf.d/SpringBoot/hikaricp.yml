group:
- name: good
  fields:
  - name: name
    DataType: String
    ValueType: Constant
    Value: prometheus
  - name: tags,host
    DataType: IPv4
    ValueType: FromLocal
    Value: UniqueKey
  - name: tags,application
    DataType: IPv4
    ValueType: FromLocal
    Value: UniqueKey
