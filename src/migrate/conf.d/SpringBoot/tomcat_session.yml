group:
- name: good
  fields:
  - name: name
    DataType: String
    ValueType: Constant
    Value: prometheus
  - name: tags,environment
    DataType: String
    ValueType: Constant
    Value: local
  - name: tags,host
    DataType: IPv4
    ValueType: FromLocal
    Value: UniqueKey
  - name: tags,application
    DataType: IPv4
    ValueType: FromLocal
    Value: UniqueKey
  - name: tags,url
    DataType: String
    ValueType: Constant
    Value: e2e-92-21.ssdcloudindia.net/actuator/prometheus
  - name: fields,tomcat_sessions_active_current_sessions
    DataType: Uint64
    ValueType: RandomRange
    Value: 0-100
  - name: fields,tomcat_sessions_active_max_sessions
    DataType: Uint64
    ValueType: RandomRange
    Value: 0-100
  - name: fields,tomcat_sessions_alive_max_seconds
    DataType: Uint64
    ValueType: RandomRange
    Value: 0-100
  - name: fields,tomcat_sessions_created_sessions_total
    DataType: Uint64
    ValueType: RandomEverIncreasing
    Value: 100-200
  - name: fields,tomcat_sessions_expired_sessions_total
    DataType: Uint64
    ValueType: RandomEverIncreasing
    Value: 10-50
  - name: fields,tomcat_sessions_rejected_sessions_total
    DataType: Uint64
    ValueType: RandomEverIncreasing
    Value: 10-90
