group:
- name: good
  fields:
  - name: name
    DataType: String
    ValueType: Constant
    Value: prometheus
  - name: tags,environment
    DataType: String
    ValueType: Constant
    Value: local
  - name: tags,host
    DataType: IPv4
    ValueType: FromLocal
    Value: UniqueKey
  - name: tags,application
    DataType: IPv4
    ValueType: FromLocal
    Value: UniqueKey
  - name: tags,url
    DataType: String
    ValueType: Constant
    Value: e2e-92-21.ssdcloudindia.net/actuator/prometheus
  - name: tags,level
    DataType: String
    ValueType: Constant
    Value: warn
  - name: fields,logback_events_total
    DataType: Uint64
    ValueType: RandomRange
    Value: 0-100
