group:
- name: good
  fields:
  - name: name
    DataType: String
    ValueType: Constant
    Value: prometheus
  - name: tags,environment
    DataType: String
    ValueType: Constant
    Value: local
  - name: tags,host
    DataType: IPv4
    ValueType: FromLocal
    Value: UniqueKey
  - name: tags,application
    DataType: IPv4
    ValueType: FromLocal
    Value: UniqueKey
  - name: tags,url
    DataType: String
    ValueType: Constant
    Value: e2e-92-21.ssdcloudindia.net/actuator/prometheus
  - name: tags,state
    DataType: String
    ValueType: Enumeration
    Value: runnable:35,waiting:30,timed-waiting:15,blocked:10,new:5,terminated:5
  - name: fields,jvm_threads_daemon_threads
    DataType: Uint64
    ValueType: RandomRange
    Value: 15-30
  - name: fields,jvm_threads_live_threads
    DataType: Uint64
    ValueType: RandomRange
    Value: 20-30
  - name: fields,jvm_threads_peak_threads
    DataType: Uint64
    ValueType: RandomRange
    Value: 20-30
  - name: fields,jvm_threads_started_threads_total
    DataType: Uint64
    ValueType: RandomEverIncreasing
    Value: 100-150
  - name: fields,jvm_threads_states_threads
    DataType: Uint64
    ValueType: RandomRange
    Value: 0-15