    DataType: Uint64
    ValueType: RandomRange
    Value: 0-100
  - name: fields,jvm_buffer_memory_used_bytes
    DataType: Uint64
    ValueType: RandomRange
    Value: 0-100
  - name: fields,jvm_buffer_total_capacity_bytes
    DataType: Uint64
    ValueType: RandomRange
    Value: 0-100
