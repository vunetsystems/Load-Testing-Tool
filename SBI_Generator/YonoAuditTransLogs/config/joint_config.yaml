# Message Type Configuration
message_type: "joint"         # Generates both audit and access log per request

# Execution Control
execution:
  mode: "duration"
  duration: "1h"
  eps: 1000                  # This will result in 10k Audit + 10k Access = 20k total messages/sec
  
# Message Distribution (for Audit messages)
distribution:
  error_only_percent: 0
  trans_only_percent: 70
  both_percent: 30
  
# Session Management
session:
  rotation_interval: "30s"
  session_id_prefix: "DSaASLX68kBafb"
  
# Message Templates (Audit/Transaction)
templates:
  error:
    error_codes: ["BSee0e01", "BSeeeee1", "TEACS206", "TEACS207"]
    error_types: ["BUSINESS_EXCEPTION", "TECHNICAL_EXCEPTION"]
    error_descriptions:
      - '{"TEACS206":{"message":"Input provided is invalid"}}'
      - '{"TEACS207":{"message":"Account not found"}}'
      - '{"BSee0e01":{"message":"Service temporarily unavailable"}}'
    error_details: ["BUSINESS_EXCEPTION", "TECHNICAL_EXCEPTION"]
    created_by: "System"
    wrap_in_message: true
  transaction:
    statuses:
      - weight: 90
        value: "success"
      - weight: 10
        value: "error"
    user_types: ["ETB_CUSTOMER", "NTB_CUSTOMER"]
    command_ids: ["statement_view", "home_dashboard_cards_getAllCBSAccountSummary", "fund_transfer_initiate"]
    channel_ids: [22, 23]
    user_relationship_numbers: ["02111764664914472", "82111764664914472"]
    biz_req_inputs: ['{"accountNo":"30096060714"}']
    biz_resp_outputs: ['{"status":"success","data":[]}']
    created_by: "System"
    wrap_in_message: true

# Access Log Templates
access_log:
  pod_names: ["gateway-6d9c98bdc7-4w5x2"]
  log_paths: ["/opt/yono_logs/homems/2026-01/apiaccess_homems-7f459887c7-8zqlc.log"]
  log_names: ["gateway-access-log"]
  channel_ids: [22, 23]
  channel_version: "v1.0"
  api_urls: ["https://istio-ingressgateway.istio-system.svc.cluster.local/HomeMS/APIServices/home_dashboard_cards_getAllCBSAccountSummary"]
  http_statuses:
    - weight: 95
      value: "200"
    - weight: 5
      value: "500"
  wrap_in_message: true
  
# EIS Message Templates
eis:
  service_ids: ["eis_statement_inb", "eis_home_dashboard_cards_getAccount Details2", "integration_eis_login_cust_cif information"]
  error_codes: ["EIS_ERROR_001"]
  error_messages: ["EIS service was not called"]
  system_names: ["EIS"]
  api_urls: ["http://121.185.16.101:6280/eis/v1", "http://121.185.16.101:6498", "http://121.185.16.101:6210/API"]
  created_by: "SYSTEM"
  wrap_in_message: true

# User ID Configuration
user_ids:
  mode: "fixed"
  fixed_list: [1212301889885902848]
  range_min: 1000000000000000000
  range_max: 9223372036854775807
  
# ID Generation parameters
id_generation:
  transaction_id_pattern: "EZ509e202T"
  request_no_length: 27
  trace_id_format: "hex"
  trace_id_length: 32
  
# Kafka Producer Configuration
kafka:
  brokers: ["e2e-83-134:9094"]
  topic: "yono-adt-trans"        # Audit topic

  access_log_topic: "ms-logs"    # Access log topic
  eis_topic: "yono-adt-service"     # EIS topic
  
  producer:
    num_producers: 10
    required_acks: 1
    compression: "none"
    max_message_bytes: 1000000
    flush_frequency: "0ms"       # Constant ingestion (no batching)
    flush_messages: 1            # Constant ingestion
    idempotent: false
    retry_max: 1
    retry_backoff: "100ms"
    enable_key: true
    
  connection:
    timeout: "10s"
    keep_alive: "30s"
    enable_tls: true
    insecure_skip_verify: true
    
# Concurrency Control
concurrency:
  worker_pool_size: 100
  buffer_size: 1000
  rate_limiter_burst: 1          # Strictly follow EPS
  
# Logging
logging:
  level: "info"
  format: "text"
  metrics_interval: "10s"
  
# Monitoring
monitoring:
  enable_metrics: false
  metrics_port: 9090
