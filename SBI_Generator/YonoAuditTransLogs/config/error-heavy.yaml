# Error-Heavy Configuration
# Target: 1000 EPS with 90% error messages
# Use case: Error handling testing, error log analysis

execution:
  mode: "duration"
  duration: "10m"
  count: 10000
  eps: 1000

distribution:
  error_only_percent: 0
  trans_only_percent: 10           # Only 10% transaction-only
  both_percent: 90                 # 90% have errors

session:
  rotation_interval: "30s"
  session_id_prefix: "DSASLX6BkBafb"

templates:
  error:
    error_codes:
      - "BSee0e01"
      - "BSeeeee1"
      - "TEACS206"
      - "TEACS207"
      - "ERR_TIMEOUT"
      - "ERR_INVALID_INPUT"
      - "ERR_AUTH_FAILED"
    error_types:
      - "BUSINESS_EXCEPTION"
      - "TECHNICAL_EXCEPTION"
      - "TIMEOUT_EXCEPTION"
      - "VALIDATION_EXCEPTION"
    error_descriptions:
      - '{"TEACS206":{"message":"Input provided is invalid"}}'
      - '{"TEACS207":{"message":"Account not found"}}'
      - '{"ERR_TIMEOUT":{"message":"Request timeout"}}'
      - '{"ERR_AUTH_FAILED":{"message":"Authentication failed"}}'
    error_details:
      - "BUSINESS_EXCEPTION"
      - "TECHNICAL_EXCEPTION"
      - "TIMEOUT_EXCEPTION"
    created_by: "System"
    
  transaction:
    statuses:
      - weight: 20
        value: "success"
      - weight: 80                 # 80% error status
        value: "error"
    user_types: ["ETB_CUSTOMER", "NTB_CUSTOMER"]
    command_ids:
      - "statement_view"
      - "fund_transfer_initiate"
      - "bill_payment_process"
    channel_ids: [22, 23]
    user_relationship_numbers: ["02111764664914472", "82111764664914472"]
    biz_req_inputs:
      - '{"viewAccountStatementRequest":{"fromDate":null,"accountNo":"30096060714","toDate":null}}'
      - '{}'
    biz_resp_outputs:
      - '{"error":"Transaction failed"}'
      - '{"status":"error","message":"Insufficient funds"}'
    created_by: "System"

user_ids:
  mode: "fixed"
  fixed_list: [1212301889885902848, 1090951129735557800]
  range_min: 1000000000000000000
  range_max: 9999999999999999999

id_generation:
  transaction_id_pattern: "cRhKTOYInnV"
  request_no_length: 27
  trace_id_format: "hex"
  trace_id_length: 32

kafka:
  brokers: ["localhost:9092"]
  topic: "yono-audit-errors"       # Separate error topic
  producer:
    num_producers: 10
    required_acks: 1
    compression: "snappy"
    max_message_bytes: 1000000
    flush_frequency: "100ms"
    flush_messages: 100
    idempotent: false
    retry_max: 3
    retry_backoff: "100ms"
  connection:
    timeout: "10s"
    keep_alive: "30s"

concurrency:
  worker_pool_size: 100
  buffer_size: 1000
  rate_limiter_burst: 100

logging:
  level: "info"
  format: "json"
  metrics_interval: "10s"

monitoring:
  enable_metrics: true
  metrics_port: 9090
