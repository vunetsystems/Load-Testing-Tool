# ==============================================================================
# User ID Logic
# ==============================================================================
user_ids:
  # mode: How UsrID is selected.
  # - "fixed": Randomly picks from the fixed_list.
  # - "range": Generates a random number between range_min and range_max.
  mode: "fixed"
  # fixed_list: A list of specific user IDs to simulate.
  fixed_list: [1212301889885902848]
  # range_min/max: Bounds for "range" mode generation.
  range_min: 1000000000000000000
  range_max: 9223372036854775807

# ==============================================================================
# ID Generation Parameters
# ==============================================================================
id_generation:
  # transaction_id_pattern: Fixed prefix used when generating trnsID.
  transaction_id_pattern: "EZ509e202T"
  # request_no_length: Total length of the generated random request number (ReqNo).
  request_no_length: 27
  # trace_id_format: Format for OpenTelemetry-compatible trace IDs.
  # Options: "hex" or "uuid".
  trace_id_format: "hex"
  # trace_id_length: Length of the trace ID (standard OTel is 32 chars).
  trace_id_length: 32
