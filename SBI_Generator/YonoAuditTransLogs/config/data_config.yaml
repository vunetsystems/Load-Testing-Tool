# ==============================================================================
# Global Message Type Configuration
# ==============================================================================
# message_type: Determines what kind of messages are generated per logical "event".
# - "json_yono": Generates only the YONO Audit/Transaction log.
# - "access_log": Generates only the API Access log.
# - "joint": Generates Audit, Access log, and EIS message for every event,
#            simulating a full end-to-end request flow with shared IDs.
message_type: "joint"

# ==============================================================================
# Message Distribution (specifically for Audit logs)
# ==============================================================================
# These percentages control the "flavor" of Audit logs generated.
# Valid for message_type: "json_yono" or "joint".
distribution:
  # error_only_percent: % of requests that only generate an Error log.
  error_only_percent: 0
  # trans_only_percent: % of requests that only generate a Transaction log (success case).
  trans_only_percent: 70
  # both_percent: % of requests that generate both Transaction and Error logs (failure case).
  both_percent: 30

# ==============================================================================
# Session Management
# ==============================================================================
session:
  # rotation_mode: How frequently to change the Session Token ID (sessnTknID).
  # Options: "time" or "count".
  rotation_mode: "count"

  # rotation_interval: Used when rotation_mode is "time" (e.g., "30s", "5m").
  rotation_interval: "30s"

  # rotation_count: Used when rotation_mode is "count".
  # Rotate session after N messages are generated by a specific session.
  rotation_count: 30

  # session_id_prefix: A fixed prefix used to generate unique session IDs.
  session_id_prefix: "DSaASLX68kBafb"

# ==============================================================================
# Audit/Transaction Message Templates
# ==============================================================================
templates:
  # Error template: Used when an error log is generated.
  error:
    # error_codes: List of codes randomly selected for ErrCD.
    error_codes: ["BSee0e01", "BSeeeee1", "TEACS206", "TEACS207"]
    # error_types: Randomly selected for ErrType.
    error_types: ["BUSINESS_EXCEPTION", "TECHNICAL_EXCEPTION"]
    # error_descriptions: Randomly selected for ErrDscrptn.
    error_descriptions:
      - '{"TEACS206":{"message":"Input provided is invalid"}}'
      - '{"TEACS207":{"message":"Account not found"}}'
      - '{"BSee0e01":{"message":"Service temporarily unavailable"}}'
    # error_details: Randomly selected for ErrDtls.
    error_details: ["BUSINESS_EXCEPTION", "TECHNICAL_EXCEPTION"]
    # created_by: Fixed value for CrtdBy field.
    created_by: "System"
    # wrap_in_message: If true, the resulting JSON is wrapped in a "message" field
    # in the final Kafka packet.
    wrap_in_message: true

  # Transaction template: Used for actual business transaction logs.
  transaction:
    # statuses: Weighted list of transaction statuses (TrnsStts).
    statuses:
      - weight: 90
        value: "success"
      - weight: 10
        value: "error"
    # user_types: Randomly selected for UsrTyp.
    user_types: ["ETB_CUSTOMER", "NTB_CUSTOMER"]
    # command_ids: List of Command IDs (CmndID) to rotate through.
    command_ids:
      [
        "statement_view",
        "home_dashboard_cards_getAllCBSAccountSummary",
        "fund_transfer_initiate",
      ]
    # channel_ids: Randomly selected for ChnlID.
    channel_ids: [22, 23]
    # user_relationship_numbers: Randomly selected for UsrRltnshpNo.
    user_relationship_numbers: ["02111764664914472", "82111764664914472"]
    # biz_req_inputs: Sample JSON inputs for BizReqInput.
    biz_req_inputs: ['{"accountNo":"30096060714"}']
    # biz_resp_outputs: Sample JSON outputs for BizRespOutput.
    biz_resp_outputs: ['{"status":"success","data":[]}']
    # created_by: Fixed value for CrtdBy field.
    created_by: "System"
    # wrap_in_message: Similar to error.wrap_in_message.
    wrap_in_message: true

